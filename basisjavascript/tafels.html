<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>tafels</h1>

<label>Geef getal voor tafel:</label>
<input type="number" id="numberInput" value="13">
<button onclick="geefTafel()">Geef de tafel</button>

<div id="result"></div>

<script>
function geefTafel() {
  let number = document.getElementById("numberInput").value;

  let antwoord = "";
  for (let i = 1; i <= 10; i++) {
    antwoord += i + " x " + number + " = " + (i * number) + "<br>";
  }

  document.getElementById("result").innerHTML = antwoord;
}
</script>

</body>
</html>
