<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather API</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container mt-4">

<h1>Weather API</h1>

<div class="mb-3">
    <input type="text" id="city" class="form-control" placeholder="Typ een stad...">
</div>

<button class="btn btn-primary" onclick="fLaadAPI()">Zoek weer</button>

<hr>

<div id="out"></div>

<script>

function fLaadAPI() {

    let city = document.getElementById("city").value;

    let url = "https://api.openweathermap.org/data/2.5/weather?q=" 
        + city + 
        "&units=metric&appid=96b12869f5220638e38b8dc23a4a8805";

    fetch(url)
        .then(data => data.json())
        .then(json => {
            console.log(json);
            fJson2Table(json);
        })
        .catch(error => {
            console.error("Fout bij laden API:", error);
        });
}

function getWindArrow(deg){

    if (deg >= 337.5 || deg < 22.5) return "↑";
    if (deg >= 22.5 && deg < 67.5) return "↗";
    if (deg >= 67.5 && deg < 112.5) return "→";
    if (deg >= 112.5 && deg < 157.5) return "↘";
    if (deg >= 157.5 && deg < 202.5) return "↓";
    if (deg >= 202.5 && deg < 247.5) return "↙";
    if (deg >= 247.5 && deg < 292.5) return "←";
    if (deg >= 292.5 && deg < 337.5) return "↖";

}

function fJson2Table(json) {

    let arrow = getWindArrow(json.wind.deg);

    let table = "<table class='table table-striped'>";

    table += "<tr>";
    table += "<th>Stad</th>";
    table += "<th>Temperatuur (°C)</th>";
    table += "<th>Windrichting</th>";
    table += "<th>Wind (m/s)</th>";
    table += "</tr>";

    table += "<tr>";
    table += "<td>" + json.name + "</td>";
    table += "<td>" + json.main.temp + "</td>";
    table += "<td>" + arrow + "</td>";
    table += "<td>" + json.wind.speed + "</td>";
    table += "</tr>";

    table += "</table>";

    document.getElementById("out").innerHTML = table;
}

</script>

</body>
</html>
